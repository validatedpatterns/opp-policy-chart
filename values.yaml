---
# Namespace for s3-ssl / s3-ca-injector Jobs and RBAC (not the Proxy CA ConfigMap itself).
clusterCaMgt:
  # -- Namespace for s3-ssl and s3-ca-injector workloads.
  namespace: cluster-ca-mgt
  # -- Create clusterCaMgt.namespace when installing the chart.
  createNamespace: false

global:
  # -- Cloud platform type. AWS enables Submariner gateway/credentials and SG-tag job.
  clusterPlatform: AWS

# DR pair cluster names - same structure as regionaldr-with-virt.
regionalDR:
  - # -- Name of this DR pair set (also Submariner broker ClusterSet name).
    name: resilient
    # -- Enable Submariner Globalnet when primary/secondary CIDRs overlap.
    globalnetEnabled: false
    clusters:
      primary:
        name: ocp-primary
      secondary:
        name: ocp-secondary

submariner:
  # -- EC2 instance type for Submariner gateway nodes.
  instanceType: m5.xlarge
  # -- IPsec NAT-T UDP port used by Submariner.
  ipsecNatPort: 4500
  # -- Enable NAT traversal (NAT-T) for Submariner IPsec tunnels.
  NATTEnable: true
  # -- Submariner cable driver (vxlan or libreswan).
  cableDriver: vxlan
  # -- Enable EC2 security group tagging job. AWS only.
  sgTagJobEnabled: false

# s3-ssl: sync/verify S3 TLS CA material from vp-manage-proxy-cluster-ca onto all clusters.
s3Ssl:
  # -- When false, skip s3-ssl Jobs, playbook ConfigMaps, and ACM CA policies.
  enabled: true
  # -- Maximum ManagedCluster readiness poll attempts before sync Job fails.
  clusterReadinessMaxAttempts: 150
  # -- Seconds between ManagedCluster readiness polls.
  clusterReadinessSleepSeconds: 30
  caBundle:
    # -- Namespace of the vp-proxy trust ConfigMap (vp-manage-proxy-cluster-ca targetNamespace).
    namespace: openshift-config
    # -- ConfigMap name (vp-manage-proxy-cluster-ca configMapName).
    name: vp-pattern-proxy-ca-bundle
    # -- Data key holding PEM.
    key: ca-bundle.crt

# Inject caCertificates into Ramen s3StoreProfiles from s3Ssl.caBundle (vp-proxy).
# Hub Job reads the CA once, patches hub Ramen, then optionally spokes via ACM kubeconfigs.
s3CaInjector:
  # -- When false, skip the Ramen s3StoreProfiles CA injector Job/CronJob.
  enabled: true
  # -- When false, patch hub Ramen only (skip ManagedCluster kubeconfigs / spoke inject).
  distributeToManagedClusters: true
  # -- Maximum ManagedCluster readiness poll attempts before injector fails (spoke path).
  clusterReadinessMaxAttempts: 150
  # -- Seconds between ManagedCluster readiness polls.
  clusterReadinessSleepSeconds: 30
  ramen:
    # -- Namespace of hub and managed Ramen operator ConfigMaps.
    namespace: openshift-operators
    # -- Hub Ramen ConfigMap name.
    hubConfigMapName: ramen-hub-operator-config
    # -- Managed-cluster Ramen ConfigMap name.
    managedConfigMapName: ramen-dr-cluster-operator-config
    # -- Key inside the Ramen ConfigMap that holds RamenConfig YAML.
    configKey: ramen_manager_config.yaml
    # -- Minimum s3StoreProfiles before patching.
    minProfiles: 1
    # -- When true, fail the one-shot Job if profiles never appear. CronJob soft-exits.
    failIfNoProfiles: true
  job:
    # -- Render a one-shot PostSync Job.
    enabled: true
    # -- Argo CD sync-wave for the Job.
    argoCDSyncWave: "10"
    # -- Seconds to wait for the vp-proxy CA ConfigMap (fallback if CA_FILE unused).
    caWaitSeconds: 3600
    # -- Seconds to wait for Ramen s3StoreProfiles.
    ramenWaitSeconds: 3600
    # -- Poll interval while waiting.
    pollInterval: 15
    # -- Job backoffLimit.
    backoffLimit: 5
    # -- Job activeDeadlineSeconds.
    activeDeadlineSeconds: 14400
  cronJob:
    # -- Render a CronJob that re-injects after MCO wipes caCertificates.
    enabled: true
    # -- Cron schedule (UTC).
    schedule: "*/15 * * * *"
    # -- Suspend the CronJob without deleting it.
    suspend: false
    # -- CronJob concurrencyPolicy.
    concurrencyPolicy: Forbid
    # -- successfulJobsHistoryLimit.
    successfulJobsHistoryLimit: 3
    # -- failedJobsHistoryLimit.
    failedJobsHistoryLimit: 3
    # -- Argo CD sync-wave for the CronJob.
    argoCDSyncWave: "10"

ansible:
  # -- Container image used for Ansible post-install jobs.
  containerImage: quay.io/validatedpatterns/utility-container:latest
  # -- Ansible-playbook verbosity level (0–4).
  verbosity: 0
  # -- Argo CD resource sync-options applied to the Ansible ConfigMap.
  configMapArgoSyncOptions: Prune=false,ServerSideApply=true
