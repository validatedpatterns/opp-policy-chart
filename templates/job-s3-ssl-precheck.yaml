{{- if eq "1" (include "opp.s3SslEnabled" . | trim) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-ssl-precheck
  namespace: {{ include "opp.clusterCaMgtNamespace" . }}
  labels:
    app.kubernetes.io/name: s3-ssl-certificate-management
    app.kubernetes.io/component: certificate-precheck
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/hook: "PostSync"
    argocd.argoproj.io/hook-delete-policy: "BeforeHookCreation"
spec:
  # Each failed Pod (e.g. OOM) counts toward backoff; lower limit avoids many dead Pods while debugging.
  backoffLimit: 5
  activeDeadlineSeconds: 7200
  template:
    spec:
      serviceAccountName: s3-ssl-precheck
      restartPolicy: Never
      containers:
      - name: s3-ssl-precheck
        image: {{ $.Values.ansible.containerImage }}
        workingDir: /playbooks
        # Ansible + kubernetes client; raise if OOMKilled (exit 137) during long until loops.
        resources:
          requests:
            memory: "384Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        env:
        - name: PRIMARY_CLUSTER
          value: {{ include "opp.primaryClusterName" . | quote }}
        - name: SECONDARY_CLUSTER
          value: {{ include "opp.secondaryClusterName" . | quote }}
        - name: CLUSTER_CA_MGT_NAMESPACE
          value: {{ include "opp.clusterCaMgtNamespace" . | quote }}
        - name: CA_BUNDLE_NAME
          value: {{ include "opp.s3SslCaBundleName" . | quote }}
        - name: CA_BUNDLE_NAMESPACE
          value: {{ include "opp.s3SslCaBundleNamespace" . | quote }}
        - name: CA_BUNDLE_KEY
          value: {{ include "opp.s3SslCaBundleKey" . | quote }}
        command:
        - ansible-playbook
        args:
        - -i
        - localhost,
        - -c
        - local
        - /playbooks/s3-ssl-precheck.yml
        volumeMounts:
        - name: playbooks
          mountPath: /playbooks
          readOnly: true
      volumes:
      - name: playbooks
        configMap:
          name: s3-ssl-precheck-playbooks
          items:
          - key: s3-ssl-precheck.yml
            path: s3-ssl-precheck.yml
          - key: tasks_kubeconfig.yml
            path: tasks/kubeconfig.yml
          - key: tasks_kubeconfig_attempt.yml
            path: tasks/kubeconfig-attempt.yml
{{- end }}
